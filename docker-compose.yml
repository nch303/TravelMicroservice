version: '3.8'

services:
  apigateway:
    build:
      context: ./src/gateway
      dockerfile: Dockerfile
    container_name: apigateway
    ports:
      - "5120:80"
      - "5120:443"
    volumes:
      - ./https:/https
    environment:
      - ASPNETCORE_URLS=http://+:80;https://+:443
    depends_on:
      - authservice
      - userservice
    networks:
      - travelnet

  authservice:
    build:
      context: ./src/services/AuthService
      dockerfile: Dockerfile
    container_name: authservice
    ports:
      - "5001:80"
      - "5001:443"
    environment:
      - BREVO_API_KEY=${BREVO_API_KEY} 
      - ASPNETCORE_URLS=http://+:80;https://+:443
    networks:
      - travelnet

  userservice:
     build:
       context: ./src/services/UserService
       dockerfile: Dockerfile
     container_name: userservice
     ports:
       - "5002:80"
       - "5002:443"
     environment:
       - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
       - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
       - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
       - ASPNETCORE_URLS=http://+:80;https://+:443
     networks:
       - travelnet

  scheduleservice:
     build:
       context: ./src/services/ScheduleService
       dockerfile: Dockerfile
     container_name: scheduleservice
     ports:
       - "5003:80"
       - "5003:443"
     environment:
       - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
       - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
       - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
       - ASPNETCORE_URLS=http://+:80;https://+:443
     networks:
       - travelnet  

  messageservice:
     build:
       context: ./src/services/MessageService
       dockerfile: Dockerfile
     container_name: messageservice
     ports:
       - "5004:80"
       - "5004:443"
     environment:
       - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
       - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
       - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
       - ASPNETCORE_URLS=http://+:80;https://+:443
     networks:
       - travelnet  
    
  advertisementservice:
     build:
       context: ./src/services/AdvertisementService
       dockerfile: Dockerfile
     container_name: advertisementService
     ports:
       - "5005:80"
       - "5005:443"
     environment:
       - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
       - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
       - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
       - ASPNETCORE_URLS=http://+:80;https://+:443
     networks:
       - travelnet  

networks:
  travelnet:
    driver: bridge

